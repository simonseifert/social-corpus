[project]
name = "corpus"
version = "0.1.0"
description = "A social content back-catalog you own. Rent the extraction, keep the corpus."
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
corpus = "corpus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["corpus", "corpus.adapters", "corpus.analyze", "corpus.enrich"]

[tool.setuptools.package-data]
corpus = ["schema.sql"]
